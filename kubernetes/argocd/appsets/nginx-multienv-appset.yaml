apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nginx-multienv
  namespace: argocd

spec:
  generators:
    - list:
        elements:
          - env: dev
            replicas: "2"
          - env: staging
            replicas: "3"
          - env: prod
            replicas: "5"

  template:
    metadata:
      name: nginx-{{env}}

    spec:
      project: platform-project

      source:
        repoURL: https://github.com/jgaragorry/k8s-argocd-platform-engineering-lab.git
        targetRevision: HEAD
        path: apps/nginx
        kustomize:
          namePrefix: "{{env}}-"

      destination:
        server: https://kubernetes.default.svc
        namespace: nginx-{{env}}

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
